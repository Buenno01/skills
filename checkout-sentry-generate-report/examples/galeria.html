<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria do Raio-X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* Kit visual do checkout-sentry-generate-report. Cores e regras: references/PADROES.md */
:root{
  --fundo:#FFFFFF; --fundo-2:#F7F7F7; --mint:#F0FDF5; --mint-2:#D6FBE3;
  --texto:#000000; --texto-aux:#6B6B6B; --borda:#ECECEC; --divisor:#D9D9D9;
  --verde-marca:#3DE982;
  /* cores semânticas de dado */
  --concluiu:#22C76A; --concluiu-txt:#117A41; --concluiu-bg:#E6FAEF;
  --critico:#E5484D; --critico-txt:#C92A2A; --critico-bg:#FDECEC;
  --atencao:#F4B619; --atencao-txt:#8A6100; --atencao-bg:#FEF6DC;
  --dado:#2461E8; --dado-bg:#E3EBFD; --outros:#8B5CF6; --outros-bg:#EFE8FE;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#FFFFFF; --texto:#000000; } }
:root[data-theme="dark"]{ --fundo:#FFFFFF; --texto:#000000; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:400;font-size:15px;line-height:1.55}
.pagina{max-width:1040px;margin:0 auto;padding:0 24px 48px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-weight:700;font-size:clamp(30px,5vw,44px)}
h2{font-weight:600;font-size:clamp(20px,3vw,26px)}
h3{font-weight:600;font-size:15px}
p{margin:0}
.aux{color:var(--texto-aux)}
.barra-verde{width:64px;height:6px;border-radius:3px;background:var(--verde-marca);margin:14px 0 16px}

/* cabeçalho */
.cabecalho{background:linear-gradient(135deg,#FFFFFF 0%,#F0FDF5 50%,#D6FBE3 100%);border-bottom:1px solid var(--borda)}
.cabecalho .pagina{padding-top:48px;padding-bottom:32px}
.sobretitulo{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--concluiu-txt)}
.subtitulo{font-size:17px;max-width:760px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:14px;color:var(--texto-aux)}
.meta b{color:var(--texto);font-weight:600}
.pilulas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pilula{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pilula.atencao{background:var(--atencao-bg);color:var(--atencao-txt);border:1px solid var(--atencao)}
.pilula.critico{background:var(--critico-bg);color:var(--critico-txt)}
.pilula.ok{background:var(--concluiu-bg);color:var(--concluiu-txt)}
.pilula.dado{background:var(--dado-bg);color:var(--dado)}
.aviso-cabecalho{font-size:13px;white-space:normal}

/* seções */
.secao{padding:40px 0 8px;border-bottom:1px solid var(--borda)}
.secao:last-of-type{border-bottom:0}
.num{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-aux);margin-bottom:6px}
.contexto{margin-top:10px;max-width:820px;color:#2E2E2E}
.destaques{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.card{border:1px solid var(--borda);border-radius:14px;padding:20px 24px;background:var(--fundo)}
.card .v{font-size:26px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.card .v.txt{font-size:19px;line-height:1.3}
.card .r{font-size:13px;font-weight:600;margin-top:4px}
.card .d{font-size:13px;color:var(--texto-aux);margin-top:6px}
.card.critico .v{color:var(--critico-txt)} .card.ok .v{color:var(--concluiu-txt)} .card.atencao .v{color:var(--atencao-txt)}
.heroi{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:16px;margin:24px 0}
.heroi .principal{background:var(--critico-bg);border-color:transparent}
.heroi .principal .v{font-size:56px;color:var(--critico-txt)}
.heroi .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
@media (max-width:720px){.heroi{grid-template-columns:1fr}}

/* gráficos */
.grafico{margin:8px 0 16px}
.lista-longa{max-height:640px;overflow-y:auto;padding-right:6px}
.grafico-titulo{font-size:14px;font-weight:600;margin:16px 0 10px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--texto-aux);margin-bottom:10px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.linha{display:grid;grid-template-columns:minmax(110px,30%) 1fr 72px;gap:12px;align-items:center;padding:5px 0}
.linha .rot{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.linha .rot small{display:block;color:var(--texto-aux);font-size:12px}
.linha .val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.trilho{height:18px;background:transparent;border-radius:5px;position:relative}
.barra{height:100%;display:flex;border-radius:5px;overflow:hidden;min-width:2px}
.seg{height:100%}
.seg.c{background:var(--concluiu)} .seg.a{background:var(--critico)} .seg.o{background:var(--outros)}
.seg.d{background:var(--dado)} .seg.w{background:var(--atencao)}
.linha.pequena .barra,.linha.pequena .val{opacity:.45}
.linha.pequena .rot{color:var(--texto-aux)}
.grupo{padding-top:8px;margin-top:4px;border-top:1px dashed var(--borda)}
.grupo:first-child{border-top:0;margin-top:0}
.grupo .nome{font-size:13px;font-weight:600;margin-bottom:2px}
.lado-a-lado{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.lado-a-lado{grid-template-columns:1fr}.linha{grid-template-columns:minmax(90px,36%) 1fr 60px}}

/* funil */
.funil .etapa{display:grid;grid-template-columns:minmax(120px,26%) 1fr 90px;gap:12px;align-items:center}
.funil .etapa .barra{height:26px}
.funil .queda{display:grid;grid-template-columns:minmax(120px,26%) 1fr;gap:12px;font-size:12px;color:var(--texto-aux);padding:4px 0}
.funil .queda span{grid-column:2;padding-left:10px;border-left:2px solid var(--divisor)}
.funil .queda.maior span{border-left-color:var(--critico);color:var(--critico-txt);font-weight:600}

/* recuperação */
.segmentada{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 10px}
.segmentada div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#000;min-width:2px;overflow:hidden;white-space:nowrap}
.canais{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0}


/* tendência */
.colunas{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:8px;border-bottom:1px solid var(--divisor);min-width:max-content}
.dia{flex:1 0 20px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.dia .pilha{width:70%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.dia .par{display:flex;gap:2px;align-items:flex-end;height:100%;width:80%;max-width:30px;justify-content:center;position:relative}
.dia .par .b{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.dia .marca{position:absolute;left:-2px;right:-2px;height:2px;background:var(--dado)}
.eixo{display:flex;gap:4px;font-size:11px;color:var(--texto-aux);min-width:max-content;margin-top:4px}
.eixo span{flex:1 0 20px;text-align:center}
.rolagem{overflow-x:auto;padding-bottom:4px}
.escala{font-size:11px;color:var(--texto-aux);margin-bottom:2px}
.pequena-dia{opacity:.45}

/* tabelas recolhíveis */
details{margin:12px 0 16px;border:1px solid var(--borda);border-radius:10px;background:var(--fundo-2)}
summary{cursor:pointer;padding:10px 16px;font-size:13px;font-weight:600}
.tabela-wrap{overflow-x:auto;background:var(--fundo);border-radius:0 0 10px 10px}
table.dados{width:100%;border-collapse:collapse;font-size:12.5px}
table.dados th{text-align:left;font-weight:600;color:var(--texto-aux);padding:8px 12px;border-bottom:1px solid var(--divisor);white-space:nowrap}
table.dados td{padding:7px 12px;border-bottom:1px solid var(--borda)}
table.dados td.n,table.dados th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nota{font-size:12.5px;color:var(--texto-aux);margin:8px 0 16px}
.vazio{font-size:13px;color:var(--texto-aux);padding:12px 0}

/* rodapé */
.rodape{background:var(--fundo-2);border-top:1px solid var(--borda);margin-top:24px}
.rodape .pagina{padding-top:32px;padding-bottom:40px;font-size:13px;color:#2E2E2E}
.rodape h3{margin-bottom:8px}
.rodape ul{margin:0;padding-left:18px}
.rodape li{margin:4px 0}

/* tooltip */
#tip{white-space:pre-line;position:fixed;z-index:10;pointer-events:none;background:#161616;color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}

/* linha no tempo (SVG) */
.linha-tempo svg{display:block;width:100%;height:auto;overflow:visible}
.linha-tempo .grade-y{stroke:var(--borda);stroke-width:1}
.linha-tempo .rotulo-y,.linha-tempo .rotulo-x{font-size:11px;fill:var(--texto-aux);font-family:inherit}

/* tabela de calor */
table.calor{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%}
table.calor th{font-weight:600;color:var(--texto-aux);text-align:left;padding:4px 8px;white-space:nowrap}
table.calor td{text-align:center;padding:8px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600}
table.calor td.zero{color:var(--texto-aux);font-weight:400}

/* galeria */
.exemplo{border:1px solid var(--borda);border-radius:14px;padding:24px;margin:24px 0}
.exemplo .ficha{font-size:13px;color:#2E2E2E;background:var(--fundo-2);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.exemplo .ficha b{font-weight:600}
.exemplo code{font-size:12px;background:var(--mint);padding:1px 6px;border-radius:4px}

</style>
</head>
<body>
<div id="raiz"></div>
<div id="tip" role="tooltip"></div>
<script id="dados" type="application/json">{}</script>
<script>
/* Kit de componentes do checkout-sentry-generate-report.
 * Funções puras que devolvem HTML (string) a partir de dados já calculados pelo kpis.py.
 * Nenhuma função calcula KPI: elas só desenham o que recebem. Veja examples/galeria.html e references/GALERIA.md.
 * Cores: c = concluiu (verde), a = abandonou (vermelho), d = dado neutro (azul), w = atenção (amarelo), o = outros (roxo).
 */
(function (global) {
  'use strict';
  var MOEDA = 'R$';

  /* ---------- formatação ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function int(v) { return v == null ? 'n/d' : Math.round(v).toLocaleString('pt-BR'); }
  /* dinheiro em R$. Sem dec: acima de mil sai sem centavos */
  function din(v, dec) { if (v == null) return 'n/d'; dec = dec == null ? (Math.abs(v) >= 1000 ? 0 : 2) : dec; return MOEDA + ' ' + v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  /* taxa de 0 a 1 em percentual com uma casa */
  function pct(v) { return v == null ? 'n/d' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
  function data(iso) { if (!iso) return 'n/d'; return new Date(iso).toLocaleDateString('pt-BR', { timeZone: 'UTC' }); }
  function diaCurto(iso) { var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
  function seg(v) { if (v == null) return 'n/d'; if (v < 60) return Math.round(v) + ' s'; return (v / 60).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' min'; }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function soma(a, f) { return arr(a).reduce(function (s, x) { return s + (f(x) || 0); }, 0); }
  /* UF sempre pela sigla que veio no dado; vazio vira "Sem UF" */
  function uf(v) { return v == null || v === '' ? 'Sem UF' : String(v); }

  /* ---------- peças básicas ---------- */
  function pilula(texto, tom, tip) { return '<span class="pilula ' + (tom || 'dado') + '"' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '>' + esc(texto) + '</span>'; }
  function pilPequena() { return ' ' + pilula('amostra pequena', 'atencao', 'Menos de 5 checkouts com desfecho. A taxa não deve ser lida como conclusão.'); }
  /* card: {v (HTML já formatado), r (rótulo), d (detalhe HTML), tom: 'critico'|'ok'|'atencao'|'principal', txt: valor textual, tip} */
  function card(o) { return '<div class="card ' + (o.tom || '') + '"' + (o.tip ? ' data-tip="' + esc(o.tip) + '"' : '') + '><div class="v' + (o.txt ? ' txt' : '') + '">' + o.v + '</div><div class="r">' + esc(o.r) + '</div>' + (o.d ? '<div class="d">' + o.d + '</div>' : '') + '</div>'; }
  function destaques(lista) { lista = arr(lista).filter(Boolean); return lista.length ? '<div class="destaques">' + lista.map(card).join('') + '</div>' : ''; }
  /* número-herói à esquerda e grade de cards à direita */
  function heroi(principal, lista) { principal.tom = 'principal'; return '<div class="heroi">' + card(principal) + '<div class="grade">' + arr(lista).filter(Boolean).map(card).join('') + '</div></div>'; }
  /* itens: [[token de cor CSS sem "--", rótulo]] */
  function legenda(itens) { return '<div class="legenda">' + itens.map(function (i) { return '<span><i style="background:var(--' + i[0] + ')"></i>' + esc(i[1]) + '</span>'; }).join('') + '</div>'; }
  var LEG_CA = [['concluiu', 'Concluiu'], ['critico', 'Abandonou']];
  var LEG_MSG = [['critico', 'Abandonou'], ['dado', 'Concluiu ou anônimo']];
  function nota(t) { return '<p class="nota">' + t + '</p>'; }
  function vazio(t) { return '<div class="vazio">' + esc(t || 'Sem ocorrências no período.') + '</div>'; }
  function titulo(t) { return t ? '<div class="grafico-titulo">' + esc(t) + '</div>' : ''; }
  function longa(n, limite) { return n > (limite || 25) ? ' class="lista-longa"' : ''; }
  function ladoALado(a, b) { return '<div class="lado-a-lado"><div>' + a + '</div><div>' + b + '</div></div>'; }

  /* ---------- barras horizontais ---------- */
  /* Empilhadas concluiu × abandonou. Largura = volume relativo ao maior grupo; valor à direita = taxa de abandono.
   * linhas: [{rotulo, concluidos, abandonados, taxa, amostra_pequena, sub (HTML), tipExtra}] */
  function empilhadas(linhas, opt) {
    opt = opt || {}; linhas = arr(linhas);
    if (!linhas.length) return vazio('Sem dados no período.');
    var max = Math.max.apply(null, linhas.map(function (l) { return (l.concluidos || 0) + (l.abandonados || 0); })) || 1;
    return '<div class="grafico">' + titulo(opt.titulo) + (opt.semLegenda ? '' : legenda(LEG_CA)) + '<div' + longa(linhas.length) + '>' + linhas.map(function (l) {
      var c = l.concluidos || 0, a = l.abandonados || 0, t = c + a;
      var tip = l.rotulo + '\nConcluiu: ' + int(c) + ' · Abandonou: ' + int(a) + '\nTaxa de abandono: ' + pct(l.taxa) + (l.tipExtra ? '\n' + l.tipExtra : '');
      return '<div class="linha' + (l.amostra_pequena ? ' pequena' : '') + '" data-tip="' + esc(tip) + '"><div class="rot">' + esc(l.rotulo) + (l.amostra_pequena ? pilPequena() : '') + (l.sub ? '<small>' + l.sub + '</small>' : '') + '</div>' +
        '<div class="trilho"><div class="barra" style="width:' + (t / max * 100).toFixed(2) + '%">' + (t ? '<div class="seg c" style="width:' + (c / t * 100) + '%"></div><div class="seg a" style="width:' + (a / t * 100) + '%"></div>' : '') + '</div></div>' +
        '<div class="val">' + pct(l.taxa) + '</div></div>';
    }).join('') + '</div></div>';
  }

  /* Barras simples de contagem. parte = trecho destacado dentro da barra (ex.: quantos abandonaram).
   * linhas: [{rotulo, valor, parte, valTxt, sub, tip, amostra_pequena}]; opt: {titulo, legenda, cor, corParte} */
  function simples(linhas, opt) {
    opt = opt || {}; linhas = arr(linhas);
    if (!linhas.length) return vazio();
    var max = Math.max.apply(null, linhas.map(function (l) { return l.valor || 0; })) || 1, cor = opt.cor || 'd', corParte = opt.corParte || 'a';
    return '<div class="grafico">' + titulo(opt.titulo) + (opt.legenda ? legenda(opt.legenda) : '') + '<div' + longa(linhas.length) + '>' + linhas.map(function (l) {
      var v = l.valor || 0, p = l.parte == null ? null : Math.min(l.parte, v);
      var inner = p == null ? '<div class="seg ' + cor + '" style="width:100%"></div>' : '<div class="seg ' + corParte + '" style="width:' + (v ? p / v * 100 : 0) + '%"></div><div class="seg ' + cor + '" style="width:' + (v ? (v - p) / v * 100 : 0) + '%"></div>';
      return '<div class="linha' + (l.amostra_pequena ? ' pequena' : '') + '"' + (l.tip ? ' data-tip="' + esc(l.tip) + '"' : '') + '><div class="rot">' + esc(l.rotulo) + (l.amostra_pequena ? pilPequena() : '') + (l.sub ? '<small>' + l.sub + '</small>' : '') + '</div>' +
        '<div class="trilho"><div class="barra" style="width:' + (v / max * 100).toFixed(2) + '%">' + inner + '</div></div><div class="val">' + (l.valTxt != null ? l.valTxt : int(v)) + '</div></div>';
    }).join('') + '</div></div>';
  }

  /* Empilhadas agrupadas: um bloco por grupo (ex.: UF), com uma linha por subgrupo (ex.: frete grátis e pago).
   * grupos: [{nome, linhas: [linha de empilhadas]}]. A escala é comum a todos os grupos. */
  function agrupadas(grupos, opt) {
    opt = opt || {}; grupos = arr(grupos);
    if (!grupos.length) return vazio('Sem dados no período.');
    var max = Math.max.apply(null, [].concat.apply([], grupos.map(function (g) { return arr(g.linhas).map(function (l) { return (l.concluidos || 0) + (l.abandonados || 0); }); }))) || 1;
    return '<div class="grafico">' + titulo(opt.titulo) + legenda(LEG_CA) + '<div' + longa(grupos.length, 12) + '>' + grupos.map(function (g) {
      return '<div class="grupo"><div class="nome">' + esc(g.nome) + '</div>' + arr(g.linhas).map(function (l) {
        var c = l.concluidos || 0, a = l.abandonados || 0, t = c + a;
        return '<div class="linha' + (l.amostra_pequena ? ' pequena' : '') + '" data-tip="' + esc(g.nome + ', ' + l.rotulo + '\nConcluiu: ' + int(c) + ' · Abandonou: ' + int(a) + '\nTaxa: ' + pct(l.taxa)) + '"><div class="rot">' + esc(l.rotulo) + (l.amostra_pequena && t ? pilPequena() : '') + (l.sub ? '<small>' + l.sub + '</small>' : '') + '</div>' +
          '<div class="trilho"><div class="barra" style="width:' + (t / max * 100).toFixed(2) + '%">' + (t ? '<div class="seg c" style="width:' + (c / t * 100) + '%"></div><div class="seg a" style="width:' + (a / t * 100) + '%"></div>' : '') + '</div></div><div class="val">' + (t ? pct(l.taxa) : 'n/d') + '</div></div>';
      }).join('') + '</div>';
    }).join('') + '</div></div>';
  }

  /* Funil: etapas [{rotulo, n}] e quedas [{n, valor}] entre uma etapa e a seguinte (o "parou" da etapa).
   * A maior queda fica em vermelho. A última etapa (concluiu) em verde. */
  function funil(etapas, quedas, opt) {
    opt = opt || {}; etapas = arr(etapas); quedas = arr(quedas);
    if (!etapas.length) return vazio('Sem dados no período.');
    var topo = etapas[0].n || 1, maior = -1, iMaior = -1;
    quedas.forEach(function (x, i) { if ((x.n || 0) > maior) { maior = x.n || 0; iMaior = i; } });
    var h = '<div class="grafico funil">' + titulo(opt.titulo);
    etapas.forEach(function (e, i) {
      var ult = i === etapas.length - 1;
      h += '<div class="etapa" data-tip="' + esc(e.rotulo + '\n' + int(e.n) + ' checkouts (' + pct(e.n / topo) + ' do início)') + '"><div class="rot" style="font-size:13px">' + esc(e.rotulo) + '</div>' +
        '<div class="trilho" style="height:26px"><div class="barra" style="width:' + (e.n / topo * 100).toFixed(2) + '%"><div class="seg ' + (ult ? 'c' : 'd') + '" style="width:100%"></div></div></div>' +
        '<div class="val" style="font-size:13px;font-weight:600;text-align:right">' + int(e.n) + '</div></div>';
      if (!ult && quedas[i]) {
        var m = i === iMaior && maior > 0;
        h += '<div class="queda' + (m ? ' maior' : '') + '"><span>' + int(quedas[i].n) + ' saíram aqui · ' + din(quedas[i].valor) + (m ? ' · maior queda' : '') + '</span></div>';
      }
    });
    return h + '</div>';
  }

  /* Barra 100% dividida em partes: [{valor, cor (token CSS), rotulo}] */
  function segmentada(partes, opt) {
    opt = opt || {}; partes = arr(partes);
    var t = soma(partes, function (p) { return p.valor; }) || 1;
    return titulo(opt.titulo) + '<div class="segmentada">' + partes.map(function (p) {
      return '<div style="width:' + (p.valor / t * 100) + '%;background:var(--' + p.cor + ')" data-tip="' + esc(p.rotulo + ': ' + int(p.valor) + ' (' + pct(p.valor / t) + ')') + '">' + (p.valor / t > .12 ? int(p.valor) : '') + '</div>';
    }).join('') + '</div>' + legenda(partes.map(function (p) { return [p.cor, p.rotulo + ' · ' + int(p.valor) + ' (' + pct(p.valor / t) + ')']; }));
  }

  /* Grade de cartões (ex.: um por canal de opt-in). lista: [card] */
  function cartoes(lista) { return '<div class="canais">' + arr(lista).filter(Boolean).map(card).join('') + '</div>'; }

  /* ---------- séries por dia ---------- */
  function eixoDias(dias) { return '<div class="eixo">' + dias.map(function (d, i) { return '<span>' + (dias.length <= 16 || i % 2 === 0 ? esc(d.rotulo) : '') + '</span>'; }).join('') + '</div>'; }

  /* Colunas empilhadas. dias: [{rotulo, tip, partes: [[classe de cor c|a|o|d|w, valor]]}] (partes de baixo para cima) */
  function colunasEmpilhadas(dias, opt) {
    opt = opt || {}; dias = arr(dias);
    if (!dias.length) return vazio('Sem dados diários.');
    var tot = dias.map(function (d) { return soma(d.partes, function (p) { return p[1]; }); }), max = Math.max.apply(null, tot) || 1;
    return '<div class="grafico">' + titulo(opt.titulo) + (opt.legenda ? legenda(opt.legenda) : '') + '<div class="escala">topo da escala: ' + (opt.fmt || int)(max) + '</div><div class="rolagem"><div class="colunas">' + dias.map(function (d, i) {
      return '<div class="dia"' + (d.tip ? ' data-tip="' + esc(d.tip) + '"' : '') + '><div class="pilha" style="height:' + (tot[i] / max * 100) + '%">' +
        d.partes.map(function (p) { return '<div class="seg ' + p[0] + '" style="height:' + (tot[i] ? (p[1] || 0) / tot[i] * 100 : 0) + '%"></div>'; }).join('') + '</div></div>';
    }).join('') + '</div>' + eixoDias(dias) + '</div></div>';
  }

  /* Colunas lado a lado (médias não se empilham) com marcador da média geral.
   * dias: [{rotulo, tip, barras: [[token de cor CSS, valor]], media}]; opt.fmt formata a escala (padrão din com 2 casas) */
  function colunasPares(dias, opt) {
    opt = opt || {}; dias = arr(dias);
    if (!dias.length) return vazio('Sem dados diários.');
    var fmt = opt.fmt || function (v) { return din(v, 2); }, vals = [0];
    dias.forEach(function (d) { arr(d.barras).forEach(function (b) { if (b[1] != null) vals.push(b[1]); }); if (d.media != null) vals.push(d.media); });
    var max = Math.max.apply(null, vals) || 1;
    return '<div class="grafico">' + titulo(opt.titulo) + (opt.legenda ? legenda(opt.legenda) : '') + '<div class="escala">topo da escala: ' + fmt(max) + '</div><div class="rolagem"><div class="colunas">' + dias.map(function (d) {
      return '<div class="dia"' + (d.tip ? ' data-tip="' + esc(d.tip) + '"' : '') + '><div class="par">' +
        arr(d.barras).map(function (b) { return '<div class="b" style="background:var(--' + b[0] + ');height:' + ((b[1] || 0) / max * 100) + '%"></div>'; }).join('') +
        (d.media != null ? '<div class="marca" style="bottom:' + (d.media / max * 100) + '%"></div>' : '') + '</div></div>';
    }).join('') + '</div>' + eixoDias(dias) + '</div></div>';
  }

  /* Linha no tempo em SVG. series: [{rotulo, cor (token CSS), valores: [número|null]}]; rotulos: eixo x.
   * opt: {titulo, fmt (formata o eixo y), max} */
  function linhaTempo(rotulos, series, opt) {
    opt = opt || {}; rotulos = arr(rotulos); series = arr(series);
    if (!rotulos.length) return vazio('Sem dados diários.');
    var W = 720, H = 200, E = 44, B = 22, fmt = opt.fmt || int;
    var vals = [].concat.apply([], series.map(function (s) { return s.valores.filter(function (v) { return v != null; }); }));
    var max = opt.max || Math.max.apply(null, vals.concat([0])) || 1;
    var x = function (i) { return E + (rotulos.length === 1 ? (W - E) / 2 : i * (W - E - 8) / (rotulos.length - 1)); };
    var y = function (v) { return 8 + (H - B - 8) * (1 - v / max); };
    var g = [0, .5, 1].map(function (f) { var v = max * f; return '<line class="grade-y" x1="' + E + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="rotulo-y" x="' + (E - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + esc(fmt(v)) + '</text>'; }).join('');
    var passo = Math.ceil(rotulos.length / 12);
    var rx = rotulos.map(function (r, i) { return i % passo ? '' : '<text class="rotulo-x" x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(r) + '</text>'; }).join('');
    var ls = series.map(function (s) {
      var d = '', pts = '';
      s.valores.forEach(function (v, i) { if (v == null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pts += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3" fill="var(--' + s.cor + ')"><title>' + esc(rotulos[i] + ' · ' + s.rotulo + ': ' + fmt(v)) + '</title></circle>'; });
      return '<path d="' + d + '" fill="none" stroke="var(--' + s.cor + ')" stroke-width="2"/>' + pts;
    }).join('');
    return '<div class="grafico linha-tempo">' + titulo(opt.titulo) + legenda(series.map(function (s) { return [s.cor, s.rotulo]; })) +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.titulo || 'Série no tempo') + '">' + g + rx + ls + '</svg></div>';
  }

  /* ---------- tabelas ---------- */
  /* Tabela recolhível. cols: [{t: título, f: função da linha, n: numérica, html: f devolve HTML}]; opt.aberta abre por padrão */
  function tabela(tit, cols, linhas, opt) {
    opt = opt || {}; linhas = arr(linhas);
    if (!linhas.length) return '';
    return '<details' + (opt.aberta ? ' open' : '') + '><summary>' + esc(tit) + ' (' + linhas.length + ')</summary><div class="tabela-wrap"><table class="dados"><thead><tr>' +
      cols.map(function (c) { return '<th' + (c.n ? ' class="n"' : '') + '>' + esc(c.t) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      linhas.map(function (l) { return '<tr>' + cols.map(function (c) { var v = c.f(l); return '<td' + (c.n ? ' class="n"' : '') + '>' + (c.html ? v : esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div></details>';
  }
  var COLS_CA = [{ t: 'Concluiu', n: 1, f: function (l) { return int(l.concluidos); } }, { t: 'Abandonou', n: 1, f: function (l) { return int(l.abandonados); } },
    { t: 'Taxa de abandono', n: 1, f: function (l) { return pct(l.taxa) + (l.amostra_pequena ? ' *' : ''); } }];

  /* Tabela de calor: linhas × colunas, intensidade pelo valor. valor(linha, coluna) devolve número ou null.
   * opt: {titulo, cor ('critico'|'dado'|'concluiu'|'atencao'), fmt} */
  function calor(linhas, colunas, valor, opt) {
    opt = opt || {}; linhas = arr(linhas); colunas = arr(colunas);
    if (!linhas.length || !colunas.length) return vazio();
    var fmt = opt.fmt || int, cor = opt.cor || 'critico', max = 0;
    linhas.forEach(function (l) { colunas.forEach(function (c) { var v = valor(l, c); if (v > max) max = v; }); });
    max = max || 1;
    return '<div class="grafico">' + titulo(opt.titulo) + '<div class="tabela-wrap"><table class="calor"><thead><tr><th></th>' + colunas.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      linhas.map(function (l) {
        return '<tr><th>' + esc(l) + '</th>' + colunas.map(function (c) {
          var v = valor(l, c);
          if (!v) return '<td class="zero">' + (v == null ? '' : fmt(v)) + '</td>';
          var a = (0.12 + 0.78 * v / max).toFixed(2);
          return '<td style="background:color-mix(in srgb, var(--' + cor + ') ' + Math.round(a * 100) + '%, #fff);color:' + (a > .55 ? '#fff' : '#000') + '" data-tip="' + esc(l + ' · ' + c + ': ' + fmt(v)) + '">' + fmt(v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  /* ---------- estrutura da página ---------- */
  /* cabecalho({sobretitulo, titulo, subtitulo, meta: [HTML], avisos: [texto]}). Sem avisos, pílula verde de coleta completa */
  function cabecalho(o) {
    var av = arr(o.avisos).map(function (a) { return '<span class="pilula atencao aviso-cabecalho">' + esc(a) + '</span>'; }).join('');
    return '<header class="cabecalho"><div class="pagina">' + (o.sobretitulo ? '<div class="sobretitulo">' + esc(o.sobretitulo) + '</div>' : '') + '<h1>' + esc(o.titulo) + '</h1><div class="barra-verde"></div>' +
      (o.subtitulo ? '<p class="subtitulo">' + esc(o.subtitulo) + '</p>' : '') +
      (arr(o.meta).length ? '<div class="meta">' + o.meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' : '') +
      '<div class="pilulas">' + (av || '<span class="pilula ok">Coleta completa para o período</span>') + '</div></div></header>';
  }
  /* secao({id, num, rotulo, titulo (conclusão), contexto, corpo}) */
  function secao(o) {
    return '<section class="secao"' + (o.id ? ' id="' + esc(o.id) + '"' : '') + '>' + (o.rotulo ? '<div class="num">' + (o.num ? o.num + '. ' : '') + esc(o.rotulo) + '</div>' : '') +
      '<h2>' + esc(o.titulo || o.rotulo) + '</h2>' + (o.contexto ? '<p class="contexto">' + esc(o.contexto) + '</p>' : '') + (o.corpo || '') + '</section>';
  }
  /* rodape({titulo, itens: [HTML], nota}) */
  function rodape(o) {
    return '<footer class="rodape"><div class="pagina"><h3>' + esc(o.titulo || 'Metodologia') + '</h3><ul>' + arr(o.itens).map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
      (o.nota ? '<p class="nota" style="margin-top:12px">' + o.nota + '</p>' : '') + '</div></footer>';
  }
  /* Tooltip para todo elemento com data-tip. Chame uma vez depois de montar a página. */
  function tooltip() {
    var tip = document.getElementById('tip');
    if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
    document.addEventListener('mousemove', function (e) {
      var alvo = e.target.closest && e.target.closest('[data-tip]');
      if (!alvo) { tip.classList.remove('on'); return; }
      tip.textContent = alvo.getAttribute('data-tip'); tip.classList.add('on');
      var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
      if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    document.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
  }

  global.Kit = {
    MOEDA: MOEDA, esc: esc, int: int, din: din, pct: pct, data: data, diaCurto: diaCurto, seg: seg, arr: arr, soma: soma, uf: uf,
    pilula: pilula, pilPequena: pilPequena, card: card, destaques: destaques, heroi: heroi, legenda: legenda, LEG_CA: LEG_CA, LEG_MSG: LEG_MSG,
    nota: nota, vazio: vazio, ladoALado: ladoALado, empilhadas: empilhadas, simples: simples, agrupadas: agrupadas, funil: funil,
    segmentada: segmentada, cartoes: cartoes, colunasEmpilhadas: colunasEmpilhadas, colunasPares: colunasPares, linhaTempo: linhaTempo,
    tabela: tabela, COLS_CA: COLS_CA, calor: calor, cabecalho: cabecalho, secao: secao, rodape: rodape, tooltip: tooltip
  };
})(window);

</script>
<script>
/* Galeria de padrões visuais do kit. Todos os dados abaixo são sintéticos e servem só para mostrar o formato.
 * Em um relatório real, cada valor vem do kpis.json (o bloco indicado na ficha de cada exemplo).
 * Gerar a página: python3 scripts/montar.py --pagina examples/galeria.js --saida examples/galeria.html --titulo "Galeria do Raio-X" */
function pagina(_K, Kit) {
  var K = Kit, H = '';

  var dias = ['2026-01-01', '2026-01-02', '2026-01-03', '2026-01-04', '2026-01-05', '2026-01-06', '2026-01-07'];

    K.cabecalho({ sobretitulo: 'loja-exemplo', titulo: 'Raio-X do checkout', subtitulo: 'Subtítulo com a leitura geral do período em uma ou duas frases.',

      { v: K.int(27), r: 'Contagem de apoio', d: 'Detalhe', tom: 'atencao' }, { txt: 1, v: 'Rótulo textual', r: 'Destaque em texto', d: 'Para nomes vindos dos dados' }]));

  exemplo('Funil com queda entre etapas', 'Kit.funil', 'Mostrar onde a jornada perde mais gente e dinheiro. A maior queda fica em vermelho.', '<code>funil</code> e <code>parou</code>',
    K.funil([{ rotulo: 'Início', n: 380 }, { rotulo: 'Contato', n: 300 }, { rotulo: 'Endereço', n: 240 }, { rotulo: 'Frete', n: 210 }, { rotulo: 'Pagamento', n: 190 }, { rotulo: 'Concluiu', n: 104 }],
      [{ n: 80, valor: 9100 }, { n: 60, valor: 7200 }, { n: 30, valor: 4100 }, { n: 20, valor: 2600 }, { n: 86, valor: 25250 }], { titulo: 'Funil do checkout (sem anônimos)' }));

  exemplo('Barras empilhadas concluiu × abandonou', 'Kit.empilhadas', 'Comparar categorias (opção de frete, UF, método, produto, combinação). Largura = volume, número = taxa de abandono.', '<code>frete.opcoes</code>, <code>regioes</code>, <code>pagamento.metodos</code>, <code>produtos</code>, <code>combinacoes</code>',
    K.empilhadas([{ rotulo: 'Categoria A', concluidos: 40, abandonados: 60, taxa: 0.6, sub: '100 checkouts' }, { rotulo: 'Categoria B', concluidos: 35, abandonados: 25, taxa: 0.4167 },
      { rotulo: 'Categoria C', concluidos: 2, abandonados: 1, taxa: 0.3333, amostra_pequena: true }], { titulo: 'Abandono por categoria' }));

  exemplo('Barras simples com parte destacada', 'Kit.simples', 'Contagens (mensagens de erro, etapa de parada). O trecho vermelho é quantos daqueles abandonaram.', '<code>erros.mensagens</code>, <code>erros.por_etapa</code>, <code>clientes.recuperaveis.por_ponto</code>',

  exemplo('Colunas empilhadas por dia', 'Kit.colunasEmpilhadas', 'Volume diário por desfecho.', '<code>por_dia</code> (<code>total</code>, <code>concluidos</code>, <code>abandonados</code>)',
    K.colunasEmpilhadas(dias.map(function (d, i) { var c = 12 + i, a = 18 - i, o = 5; return { rotulo: K.diaCurto(d), partes: [['c', c], ['a', a], ['o', o]], tip: K.diaCurto(d) + '\nConcluiu: ' + c + ' · Abandonou: ' + a }; }),
      { titulo: 'Checkouts por dia', legenda: [['concluiu', 'Concluiu'], ['critico', 'Abandonou'], ['outros', 'Anônimo ou em andamento']] }));

  exemplo('Colunas lado a lado com média', 'Kit.colunasPares', 'Médias por dia (ticket, frete). Médias não se empilham.', '<code>por_dia[].ticket_medio</code>, <code>por_dia[].frete_medio</code>',
    K.colunasPares(dias.map(function (d, i) { return { rotulo: K.diaCurto(d), barras: [['critico', 310 + i * 12], ['concluiu', 260 + i * 5]], media: 285 + i * 8 }; }),
      { titulo: 'Ticket médio por dia', legenda: [['critico', 'Abandonou'], ['concluiu', 'Concluiu'], ['dado', 'Média geral']] }));

  exemplo('Linha no tempo', 'Kit.linhaTempo', 'Direção de uma taxa ou média ao longo dos dias, quando a forma da curva importa mais que o valor de cada dia.', '<code>por_dia</code> (taxa derivada: diga que é derivada)',
    K.linhaTempo(dias.map(K.diaCurto), [{ rotulo: 'Abandonados', cor: 'critico', valores: [18, 17, 16, 15, 14, 13, 12] }, { rotulo: 'Concluídos', cor: 'concluiu', valores: [12, 13, 14, 15, 16, null, 18] }],
      { titulo: 'Abandonados × concluídos por dia' }));

  exemplo('Tabela de calor', 'Kit.calor', 'Cruzar duas dimensões com contagem (ex.: etapa × tipo de alerta).', '<code>erros.por_etapa</code>',
    K.calor(['Contato', 'Endereço', 'Frete', 'Pagamento'], ['INPUT_INVALID', 'INPUT_REQUIRED', 'PAYMENT_ERROR'], function (l, c) { return { Contato: [6, 2, 0], 'Endereço': [9, 4, 0], Frete: [1, 0, 0], Pagamento: [3, 1, 22] }[l][['INPUT_INVALID', 'INPUT_REQUIRED', 'PAYMENT_ERROR'].indexOf(c)]; },
      { titulo: 'Checkouts com alerta por etapa e tipo' }));

  exemplo('Tabela recolhível', 'Kit.tabela', 'Números completos embaixo de todo gráfico, para quem quer conferir.', 'o mesmo bloco do gráfico',
    K.tabela('Todas as categorias', [{ t: 'Categoria', f: function (l) { return l.rotulo; } }].concat(K.COLS_CA),
      [{ rotulo: 'Categoria A', concluidos: 40, abandonados: 60, taxa: 0.6 }, { rotulo: 'Categoria B', concluidos: 35, abandonados: 25, taxa: 0.4167 }], { aberta: true }));

  exemplo('Dois gráficos lado a lado', 'Kit.ladoALado', 'Mesma medida em dois recortes que o leitor deve comparar.', 'qualquer bloco',
    K.ladoALado(K.simples([{ rotulo: 'Mensagem 1', valor: 8, parte: 5 }, { rotulo: 'Mensagem 2', valor: 3, parte: 1 }], { titulo: 'Recorte 1', legenda: K.LEG_MSG }),
      K.simples([{ rotulo: 'Mensagem 3', valor: 6, parte: 2 }], { titulo: 'Recorte 2', legenda: K.LEG_MSG })));

  exemplo('Seção completa', 'Kit.secao', 'Envolve qualquer combinação acima com título-conclusão e contexto.', 'narrativa escrita pelo agente',
    K.secao({ num: 1, rotulo: 'Rótulo da seção', titulo: 'Título que afirma a conclusão da seção', contexto: 'Uma a três frases que explicam o porquê e o que fazer, citando no máximo dois números que a seção mostra.',
      corpo: K.destaques([{ v: K.pct(0.41), r: 'Número de apoio' }]) }));

  exemplo('Rodapé de metodologia', 'Kit.rodape', 'Fecho da página com as definições usadas.', '<code>fonte</code>, <code>periodo</code>',
    K.rodape({ itens: ['Definição da taxa.', 'Regra de pessoa.', 'Critério de recuperável.', 'Valores em ' + K.MOEDA + '.'] }));

  return '<main class="pagina"><h1 style="margin-top:40px">Galeria do Raio-X</h1><div class="barra-verde"></div><p class="subtitulo">Padrões visuais do kit, com dados sintéticos. Escolha os que respondem ao pedido e combine como quiser.</p>' + H + '</main>';
}
